<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#557A5B" />
    <title>Offline — Shakthi Yoga</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: #faf9f6;
        color: #2c2c2c;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 560px; }
      .eyebrow {
        margin: 0 0 16px;
        color: #557a5b;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 20px;
        font-family: Georgia, serif;
        font-size: clamp(2.2rem, 8vw, 4rem);
        font-weight: 500;
        line-height: 1.15;
      }
      .message { margin: 0 0 28px; color: #5a544c; line-height: 1.7; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #557a5b;
        color: white;
        font-weight: 650;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #d4a373; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">You are offline</p>
      <h1>Take a breath.</h1>
      <p class="message">
        This page is not available without a connection. Previously visited public
        Shakthi Yoga pages may still be available, or reconnect and try again.
      </p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
