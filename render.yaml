services:
  - type: web
    name: shakthi-yoga-frontend
    runtime: node
    plan: free
    repo: https://github.com/ragul835/shakthi-yoga-frontend
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://shakthi-yoga-frontend.onrender.com
      - key: BACKEND_INTERNAL_URL
        value: https://shakthi-yoga-backend.onrender.com
